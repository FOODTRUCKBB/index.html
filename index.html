<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BB · Planning Food Truck</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#1e1f20; --panel:#28292b; --panel2:#323436; --line:#3d3f42;
  --cream:#efe9e1; --muted:#9a968f;
  --blue:#0b57b0; --red:#e03328; --green:#2e9e5b; --orange:#e8892b; --grey:#6b6e72;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--cream);font-family:'Inter',sans-serif;min-height:100vh}
h1,h2,h3,.anton{font-family:'Anton',sans-serif;text-transform:uppercase;letter-spacing:.02em;font-weight:400}

header{padding:16px 22px 0;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.logo{font-family:'Anton';font-size:40px;line-height:1;text-align:center}
.logo .bar{display:flex;height:4px;margin-top:4px}
.logo .bar i{flex:1}.logo .bar i:nth-child(1){background:var(--blue)}
.logo .bar i:nth-child(2){background:#fff}.logo .bar i:nth-child(3){background:var(--red)}
header h1{font-size:26px;flex:1;min-width:180px}
header h1 small{display:block;font-family:'Inter';font-size:11px;color:var(--muted);letter-spacing:.1em;margin-top:2px}
.tricolor{height:4px;display:flex;margin-top:14px}
.tricolor i{flex:1}.tricolor i:nth-child(1){background:var(--blue)}
.tricolor i:nth-child(2){background:#fff}.tricolor i:nth-child(3){background:var(--red)}

button,.btn{background:var(--cream);color:var(--bg);border:none;padding:8px 13px;font-family:'Anton';
  text-transform:uppercase;letter-spacing:.04em;font-size:13px;cursor:pointer;border-radius:3px}
button:hover{background:#fff}
button.ghost{background:transparent;color:var(--cream);border:1px solid var(--line)}
button.ghost:hover{border-color:var(--cream);background:transparent}
button.danger{background:var(--red);color:#fff}
button.on{background:var(--red);color:#fff}

.layout{display:grid;grid-template-columns:230px 1fr;gap:18px;padding:18px 22px 40px}
@media(max-width:860px){.layout{grid-template-columns:1fr}}

/* Étiquettes */
.side{background:var(--panel);border-radius:6px;padding:14px;align-self:start}
.side h3{font-size:16px;margin-bottom:4px}
.side p.hint{font-size:11px;color:var(--muted);margin-bottom:10px}
.tag{display:flex;align-items:center;gap:8px;padding:8px 10px;margin-bottom:6px;background:var(--panel2);
  border-left:5px solid var(--c);border-radius:3px;cursor:grab;font-weight:600;font-size:13px;user-select:none}
.tag:active{cursor:grabbing}
.tag span{flex:1}
.tag b{cursor:pointer;color:var(--muted);font-weight:400;padding:0 3px}
.tag b:hover{color:var(--red)}
.newtag{display:flex;gap:6px;margin-top:10px}
.newtag input[type=text]{flex:1;min-width:0}
.newtag input[type=color]{width:36px;padding:0;border:none;background:none;height:34px}

input,select,textarea{background:var(--bg);color:var(--cream);border:1px solid var(--line);
  padding:8px 10px;border-radius:3px;font-family:inherit;font-size:14px;width:100%}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--cream)}

/* Barre de vues + navigation */
.toolbar{display:flex;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.views{display:flex;gap:6px}
.nav{display:flex;align-items:center;gap:8px;margin-left:auto}
.nav h2{font-size:20px;min-width:230px;text-align:center}
.actions{display:flex;gap:6px;flex-wrap:wrap;margin-left:6px}

/* Bandeau stats */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-bottom:14px}
.stat{background:var(--panel);border-radius:6px;padding:11px 13px;border-top:3px solid var(--line)}
.stat label{display:block;font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;margin-bottom:4px}
.stat .v{font-family:'Anton';font-size:24px;line-height:1.1}
.stat small{display:block;font-size:11px;color:var(--muted);margin-top:2px}
.stat.goal input{font-family:'Anton';font-size:20px;padding:3px 6px;margin-top:2px}
.pos{color:var(--green)}.neg{color:var(--red)}

/* Semaine */
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:8px}
@media(max-width:1100px){.week{grid-template-columns:repeat(2,1fr)}}
@media(max-width:560px){.week{grid-template-columns:1fr}}
.day{background:var(--panel);border-radius:6px;min-height:230px;display:flex;flex-direction:column;border-top:3px solid var(--line)}
.day.today{border-top-color:var(--red)}
.day.over{background:var(--panel2);outline:2px dashed var(--cream)}
.dh{display:flex;justify-content:space-between;align-items:baseline;padding:9px 11px 5px}
.dh .n{font-family:'Anton';font-size:26px;line-height:1}
.dh .w{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.dtot{padding:0 11px 6px;font-size:11px;color:var(--muted)}
.evs{padding:0 8px 8px;flex:1}
.ev{background:var(--panel2);border-left:5px solid var(--c);border-radius:3px;padding:7px 8px;margin-bottom:6px;
  cursor:pointer;position:relative;font-size:12px}
.ev:hover{background:#3a3c3f}
.ev .t{font-weight:700;font-size:13px;padding-right:18px;line-height:1.2}
.ev .m{color:var(--muted);margin-top:2px;line-height:1.3}
.ev .ca{margin-top:4px;font-weight:600;font-size:11px}
.dot{position:absolute;top:8px;right:8px;width:11px;height:11px;border-radius:50%;background:var(--p)}
.add{width:calc(100% - 16px);margin:0 8px 8px;background:transparent;color:var(--muted);
  border:1px dashed var(--line);font-family:'Inter';font-size:12px;text-transform:none;letter-spacing:0;padding:6px}
.add:hover{color:var(--cream);border-color:var(--cream);background:transparent}

/* Mois */
.month{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.mh{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;text-align:center;padding:4px}
.mc{background:var(--panel);border-radius:4px;min-height:96px;padding:5px;cursor:pointer;border-top:2px solid transparent}
.mc.out{opacity:.35}
.mc.today{border-top-color:var(--red)}
.mc.over{outline:2px dashed var(--cream)}
.mc .n{font-family:'Anton';font-size:15px;color:var(--muted)}
.mc .me{font-size:10.5px;padding:2px 4px;margin-top:2px;border-left:3px solid var(--c);background:var(--panel2);
  border-radius:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@media(max-width:560px){.mc{min-height:62px}.mc .me{font-size:0;padding:0;height:5px;border-left:0;background:var(--c)}}

/* Récap */
.recap h3{font-size:19px;margin:22px 0 10px;display:flex;align-items:center;gap:10px}
.recap h3:before{content:"";width:6px;height:20px;background:var(--red)}
.tbl{width:100%;border-collapse:collapse;background:var(--panel);border-radius:6px;overflow:hidden;font-size:13px}
.tbl th{font-family:'Anton';font-weight:400;text-transform:uppercase;letter-spacing:.05em;font-size:12px;
  text-align:left;padding:9px 11px;background:var(--panel2);color:var(--muted)}
.tbl td{padding:9px 11px;border-top:1px solid var(--line)}
.tbl td.r,.tbl th.r{text-align:right}
.tbl tr.click{cursor:pointer}.tbl tr.click:hover td{background:#2f3133}
.pill{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px;background:var(--c)}
.progress{height:10px;background:var(--bg);border-radius:5px;overflow:hidden;margin-top:8px}
.progress i{display:block;height:100%;background:var(--green)}
.empty{color:var(--muted);padding:18px;text-align:center;background:var(--panel);border-radius:6px}
.scroll{overflow-x:auto}

/* Modal */
.modal{position:fixed;inset:0;background:rgba(0,0,0,.72);display:none;align-items:center;justify-content:center;z-index:50;padding:14px}
.modal.open{display:flex}
.box{background:var(--panel);border-radius:8px;padding:20px;width:100%;max-width:480px;max-height:94vh;overflow-y:auto;border-top:4px solid var(--red)}
.box h2{font-size:22px;margin-bottom:12px}
.row{margin-bottom:10px}
.row label{display:block;font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;margin-bottom:4px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.sect{font-family:'Anton';text-transform:uppercase;font-size:13px;letter-spacing:.05em;margin:14px 0 8px;
  padding-top:10px;border-top:1px solid var(--line);color:var(--cream)}
.prio{display:flex;gap:6px;flex-wrap:wrap}
.prio label{display:flex;align-items:center;gap:6px;background:var(--bg);border:1px solid var(--line);
  padding:6px 10px;border-radius:3px;cursor:pointer;font-size:12px;text-transform:none;letter-spacing:0;color:var(--cream);margin:0}
.prio input{width:auto}
.prio label.sel{border-color:var(--cream)}
.btns{display:flex;gap:8px;margin-top:16px;justify-content:flex-end}

.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--cream);color:var(--bg);
  padding:10px 18px;border-radius:4px;font-weight:700;font-size:13px;opacity:0;pointer-events:none;transition:.25s;z-index:99}
.toast.show{opacity:1}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:11px;color:var(--muted);margin-bottom:12px}
.legend span:before{content:"";display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--p);margin-right:5px}
</style>
</head>
<body>

<header>
  <div class="logo">BB<div class="bar"><i></i><i></i><i></i></div></div>
  <h1>Planning Food Truck<small>ÉVÉNEMENTS · SERVICES · CHIFFRE D'AFFAIRES</small></h1>
</header>
<div class="tricolor"><i></i><i></i><i></i></div>

<div class="layout">
  <aside class="side">
    <h3>Étiquettes</h3>
    <p class="hint">Glisse une étiquette sur un jour (ou clique dessus pour l'ajouter).</p>
    <div id="tags"></div>
    <div class="newtag">
      <input type="text" id="newTagName" placeholder="Nouvelle étiquette">
      <input type="color" id="newTagColor" value="#0b57b0">
      <button id="btnAddTag">+</button>
    </div>
  </aside>

  <main>
    <div class="toolbar">
      <div class="views">
        <button class="ghost" data-view="week">Semaine</button>
        <button class="ghost" data-view="month">Mois</button>
        <button class="ghost" data-view="recap">Récap</button>
      </div>
      <div class="nav">
        <button class="ghost" id="prev">◀</button>
        <h2 id="title"></h2>
        <button class="ghost" id="next">▶</button>
        <button id="today">Aujourd'hui</button>
      </div>
      <div class="actions">
        <button class="ghost" id="btnExport">Exporter</button>
        <button class="ghost" id="btnImport">Importer</button>
        <input type="file" id="fileImport" accept=".json" hidden>
      </div>
    </div>

    <div class="legend">
      <span style="--p:var(--red)">Obligatoire</span>
      <span style="--p:var(--green)">Confirmé</span>
      <span style="--p:var(--orange)">À confirmer</span>
      <span style="--p:var(--grey)">Optionnel</span>
    </div>

    <div id="stage"></div>
  </main>
</div>

<!-- Modal événement -->
<div class="modal" id="modal">
  <div class="box">
    <h2 id="mTitle">Événement</h2>
    <div class="row"><label>Titre</label><input type="text" id="fTitle" placeholder="Ex : SCABB – match à domicile"></div>
    <div class="two">
      <div class="row"><label>Date</label><input type="date" id="fDate"></div>
      <div class="row"><label>Heure</label><input type="text" id="fTime" placeholder="ex : 18h30"></div>
    </div>
    <div class="two">
      <div class="row"><label>Lieu</label><input type="text" id="fPlace" placeholder="Ville / site"></div>
      <div class="row"><label>Étiquette</label><select id="fTag"></select></div>
    </div>
    <div class="row"><label>Importance</label>
      <div class="prio" id="fPrio"></div>
    </div>

    <div class="sect">Prévisionnel</div>
    <div class="two">
      <div class="row"><label>CA prévu (€)</label><input type="number" id="fCaP" min="0" step="any" placeholder="0"></div>
      <div class="row"><label>Visiteurs attendus</label><input type="number" id="fVisP" min="0" step="1" placeholder="0"></div>
    </div>
    <div class="sect">Réel (après l'événement)</div>
    <div class="two">
      <div class="row"><label>CA réel (€)</label><input type="number" id="fCaR" min="0" step="any" placeholder="0"></div>
      <div class="row"><label>Visiteurs réels</label><input type="number" id="fVisR" min="0" step="1" placeholder="0"></div>
    </div>

    <div class="row"><label>Note</label><textarea id="fNote" rows="2" placeholder="Contact, emplacement, infos…"></textarea></div>
    <div class="btns">
      <button class="danger" id="bDel">Supprimer</button>
      <button class="ghost" id="bCancel">Annuler</button>
      <button id="bSave">Enregistrer</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
/* ---------- Utilitaires ---------- */
const $=id=>document.getElementById(id);
const KEY='bb-foodtruck-planning-v1';
const PRIOS={red:{n:'Obligatoire',c:'#e03328'},green:{n:'Confirmé',c:'#2e9e5b'},orange:{n:'À confirmer',c:'#e8892b'},grey:{n:'Optionnel',c:'#6b6e72'}};
const MOIS=['Janvier','Février','Mars','Avril','Mai','Juin','Juillet','Août','Septembre','Octobre','Novembre','Décembre'];
const JOURS=['Lun','Mar','Mer','Jeu','Ven','Sam','Dim'];
const pad=n=>String(n).padStart(2,'0');
const iso=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parse=s=>{const[a,b,c]=s.split('-').map(Number);return new Date(a,b-1,c)};
const mondayOf=d=>{const x=new Date(d.getFullYear(),d.getMonth(),d.getDate());x.setDate(x.getDate()-((x.getDay()+6)%7));return x};
const addDays=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x};
const num=v=>(v===''||v==null||isNaN(+v))?null:+v;
const eur=n=>(n==null?0:Math.round(n)).toLocaleString('fr-FR')+' €';
const nb=n=>(n==null?0:Math.round(n)).toLocaleString('fr-FR');
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&','<':'<','>':'>','"':'"'}[c]));
function toast(m){const t=$('toast');t.textContent=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),1800)}

/* ---------- Données ---------- */
const uid=()=>Math.random().toString(36).slice(2,9);
function defaults(){
  const tags=[
    {id:'scabb',name:'SCABB',color:'#0b57b0'},
    {id:'asse',name:'ASSE',color:'#2e9e5b'},
    {id:'ol',name:'OL / Groupama',color:'#e03328'},
    {id:'lou',name:'LOU Rugby',color:'#c8a84b'},
    {id:'salon',name:'Salon / Expo',color:'#8e6bbf'},
    {id:'nomad',name:'Nomad Kitchen',color:'#e8892b'},
    {id:'autre',name:'Autre',color:'#6b6e72'}
  ];
  const e=(date,title,tag,prio,place,time,note)=>({id:uid(),date,title,tag,prio,place,time,note,caP:null,caR:null,visP:null,visR:null});
  return {tags,events:[
    e('2026-12-04','SCABB – match à domicile','scabb','red','Salle du SCABB','', ''),
    e('2026-12-08','SCABB – match à domicile','scabb','red','Salle du SCABB','', ''),
    e('2026-12-22','SCABB – match à domicile','scabb','red','Salle du SCABB','', ''),
    e('2026-12-05','ASSE – Nancy','asse','green','Saint-Étienne','', 'À vérifier'),
    e('2026-12-10','Mondial des Métiers ou OL (à décider)','salon','orange','Eurexpo Lyon','', 'Choisir'),
    e('2026-12-19','LOU – Toulon','lou','green','Matmut Stadium','', 'À vérifier')
  ],goals:{}};
}
let state;
try{state=JSON.parse(localStorage.getItem(KEY))}catch(e){}
if(!state||!state.tags||!state.events)state=defaults();
state.goals=state.goals||{};
// compat V1 : ajoute les nouveaux champs si absents
state.events.forEach(ev=>{['caP','caR','visP','visR'].forEach(k=>{if(!(k in ev))ev[k]=null})});
const save=()=>localStorage.setItem(KEY,JSON.stringify(state));
const tagOf=id=>state.tags.find(t=>t.id===id)||{name:'—',color:'#6b6e72'};

/* ---------- État d'affichage ---------- */
let view='week';
let cursor=new Date(); // date de référence
if(cursor.getFullYear()<2026)cursor=new Date(2026,11,1);

/* ---------- Calculs ---------- */
function sumEvents(list){
  const done=list.filter(e=>e.caR!=null);
  return {
    n:list.length,
    caP:list.reduce((a,e)=>a+(e.caP||0),0),
    caR:list.reduce((a,e)=>a+(e.caR||0),0),
    visP:list.reduce((a,e)=>a+(e.visP||0),0),
    visR:list.reduce((a,e)=>a+(e.visR||0),0),
    done:done.length,
    // prévu des événements déjà réalisés (pour comparer à armes égales)
    caPdone:done.reduce((a,e)=>a+(e.caP||0),0)
  };
}
const evOnDay=ds=>state.events.filter(e=>e.date===ds).sort((a,b)=>(a.time||'').localeCompare(b.time||''));
const evInRange=(a,b)=>state.events.filter(e=>e.date>=iso(a)&&e.date<=iso(b));

/* ---------- Étiquettes ---------- */
function renderTags(){
  $('tags').innerHTML=state.tags.map(t=>`
    <div class="tag" draggable="true" data-id="${t.id}" style="--c:${t.color}">
      <span>${esc(t.name)}</span><b data-del="${t.id}" title="Supprimer">×</b>
    </div>`).join('');
  document.querySelectorAll('.tag').forEach(el=>{
    el.addEventListener('dragstart',e=>{e.dataTransfer.setData('text/plain',el.dataset.id);e.dataTransfer.effectAllowed='copy'});
    el.addEventListener('click',e=>{
      if(e.target.dataset.del)return;
      openModal({date:iso(view==='week'?mondayOf(cursor):cursor),tag:el.dataset.id});
    });
  });
  document.querySelectorAll('[data-del]').forEach(b=>b.onclick=e=>{
    e.stopPropagation();
    if(confirm('Supprimer cette étiquette ? (les événements existants sont conservés)')){
      state.tags=state.tags.filter(t=>t.id!==b.dataset.del);save();renderTags()}
  });
}
$('btnAddTag').onclick=()=>{
  const n=$('newTagName').value.trim();if(!n)return;
  state.tags.push({id:uid(),name:n,color:$('newTagColor').value});
  $('newTagName').value='';save();renderTags();
};

/* ---------- Vue semaine ---------- */
function statsHTML(list,goalKey,goalLabel){
  const s=sumEvents(list);
  const goal=state.goals[goalKey];
  const ecart=s.done?s.caR-s.caPdone:null;
  return `
  <div class="stats">
    <div class="stat" style="border-top-color:var(--blue)"><label>Services</label><div class="v">${s.n}</div><small>${s.done} terminé${s.done>1?'s':''}</small></div>
    <div class="stat" style="border-top-color:var(--orange)"><label>CA prévu</label><div class="v">${eur(s.caP)}</div><small>${nb(s.visP)} visiteurs attendus</small></div>
    <div class="stat" style="border-top-color:var(--green)"><label>CA réel</label><div class="v">${eur(s.caR)}</div><small>${nb(s.visR)} visiteurs réels</small></div>
    <div class="stat" style="border-top-color:var(--red)"><label>Écart (réalisés)</label>
      <div class="v ${ecart==null?'':ecart>=0?'pos':'neg'}">${ecart==null?'—':(ecart>=0?'+':'')+eur(ecart)}</div><small>réel − prévu</small></div>
    <div class="stat goal"><label>${goalLabel}</label>
      <input type="number" min="0" step="any" id="goalInput" data-key="${goalKey}" value="${goal??''}" placeholder="€ à saisir">
      <small>${goal?Math.round(s.caR/goal*100)+' % atteint (réel)':'ton objectif manuel'}</small></div>
  </div>`;
}
function bindGoal(){
  const g=$('goalInput');if(!g)return;
  g.onchange=()=>{const v=num(g.value);if(v==null)delete state.goals[g.dataset.key];else state.goals[g.dataset.key]=v;save();render()};
}
function evCard(e){
  const t=tagOf(e.tag);
  const ca=[];
  if(e.caP!=null)ca.push(`Prévu ${eur(e.caP)}`);
  if(e.caR!=null)ca.push(`<span class="pos">Réel ${eur(e.caR)}</span>`);
  const vis=(e.visP!=null||e.visR!=null)?`👥 ${e.visP!=null?nb(e.visP):'?'}${e.visR!=null?' → '+nb(e.visR):''}`:'';
  return `<div class="ev" data-id="${e.id}" style="--c:${t.color}">
    <span class="dot" style="--p:${PRIOS[e.prio]?.c||'#6b6e72'}"></span>
    <div class="t">${esc(e.title)}</div>
    <div class="m">${esc(t.name)}${e.time?' · '+esc(e.time):''}${e.place?'<br>📍 '+esc(e.place):''}</div>
    ${ca.length||vis?`<div class="ca">${ca.join(' · ')}${ca.length&&vis?'<br>':''}${vis}</div>`:''}
  </div>`;
}
function renderWeek(){
  const mon=mondayOf(cursor),sun=addDays(mon,6);
  const list=evInRange(mon,sun);
  const k=iso(mon);
  $('title').textContent=`${mon.getDate()} ${MOIS[mon.getMonth()].slice(0,4)}. → ${sun.getDate()} ${MOIS[sun.getMonth()].slice(0,4)}. ${sun.getFullYear()}`;
  let h=statsHTML(list,'w:'+k,'Objectif semaine')+'<div class="week">';
  for(let i=0;i<7;i++){
    const d=addDays(mon,i),ds=iso(d),evs=evOnDay(ds),s=sumEvents(evs);
    h+=`<div class="day ${ds===iso(new Date())?'today':''}" data-date="${ds}">
      <div class="dh"><div class="n">${d.getDate()}</div><div class="w">${JOURS[i]}</div></div>
      <div class="dtot">${evs.length?`${eur(s.caP)} prévu${s.caR?' · '+eur(s.caR)+' réel':''}`:'&nbsp;'}</div>
      <div class="evs">${evs.map(evCard).join('')}</div>
      <button class="add" data-add="${ds}">+ ajouter</button>
    </div>`;
  }
  $('stage').innerHTML=h+'</div>';
  bindGoal();bindDrop('.day');
}

/* ---------- Vue mois ---------- */
function renderMonth(){
  const y=cursor.getFullYear(),m=cursor.getMonth();
  const first=new Date(y,m,1),last=new Date(y,m+1,0);
  const list=evInRange(first,last);
  $('title').textContent=`${MOIS[m]} ${y}`;
  let h=statsHTML(list,'m:'+y+'-'+pad(m+1),'Objectif mois');
  h+='<div class="month">'+JOURS.map(j=>`<div class="mh">${j}</div>`).join('');
  const start=mondayOf(first);
  const weeks=Math.ceil(((last-start)/864e5+1)/7);
  for(let i=0;i<weeks*7;i++){
    const d=addDays(start,i),ds=iso(d),evs=evOnDay(ds);
    h+=`<div class="mc ${d.getMonth()!==m?'out':''} ${ds===iso(new Date())?'today':''}" data-date="${ds}">
      <div class="n">${d.getDate()}</div>
      ${evs.map(e=>`<div class="me" data-id="${e.id}" style="--c:${tagOf(e.tag).color}" title="${esc(e.title)}">${esc(e.title)}</div>`).join('')}
    </div>`;
  }
  $('stage').innerHTML=h+'</div>';
  bindGoal();bindDrop('.mc');
}

/* ---------- Vue récap (mois) ---------- */
function renderRecap(){
  const y=cursor.getFullYear(),m=cursor.getMonth();
  const first=new Date(y,m,1),last=new Date(y,m+1,0);
  const list=evInRange(first,last).sort((a,b)=>a.date.localeCompare(b.date));
  $('title').textContent=`Récap · ${MOIS[m]} ${y}`;
  const s=sumEvents(list);
  const goal=state.goals['m:'+y+'-'+pad(m+1)];
  let h='<div class="recap">'+statsHTML(list,'m:'+y+'-'+pad(m+1),'Objectif mois');
  if(goal){
    const p=Math.min(100,Math.round(s.caR/goal*100));
    h+=`<div class="stat" style="margin-bottom:6px"><label>Progression vers l'objectif</label>
      <div class="v">${eur(s.caR)} <span style="color:var(--muted);font-size:16px">/ ${eur(goal)}</span></div>
      <div class="progress"><i style="width:${p}%"></i></div>
      <small>Prévu total : ${eur(s.caP)} (${Math.round(s.caP/goal*100)} % de l'objectif)</small></div>`;
  }
  if(!list.length){$('stage').innerHTML=h+'<div class="empty" style="margin-top:14px">Aucun événement ce mois-ci.</div></div>';bindGoal();return}

  // Agenda du mois
  h+='<h3>Agenda du mois</h3><div class="scroll"><table class="tbl"><tr><th>Date</th><th>Événement</th><th>Lieu</th><th class="r">Prévu</th><th class="r">Réel</th><th class="r">Visiteurs</th><th class="r">€ / visiteur</th></tr>';
  list.forEach(e=>{
    const d=parse(e.date),t=tagOf(e.tag);
    const pv=e.visR?e.caR/e.visR:null;
    h+=`<tr class="click" data-id="${e.id}">
      <td><span class="pill" style="--c:${PRIOS[e.prio]?.c}"></span>${JOURS[(d.getDay()+6)%7]} ${d.getDate()}</td>
      <td><b>${esc(e.title)}</b><br><span style="color:var(--muted);font-size:11px"><span class="pill" style="--c:${t.color}"></span>${esc(t.name)}</span></td>
      <td>${esc(e.place)}</td>
      <td class="r">${e.caP!=null?eur(e.caP):'—'}</td>
      <td class="r">${e.caR!=null?'<b class="pos">'+eur(e.caR)+'</b>':'—'}</td>
      <td class="r">${e.visP!=null?nb(e.visP):'—'}${e.visR!=null?' → <b>'+nb(e.visR)+'</b>':''}</td>
      <td class="r">${pv!=null?pv.toFixed(2).replace('.',',')+' €':'—'}</td></tr>`;
  });
  h+=`<tr><td colspan="3"><b>TOTAL</b></td><td class="r"><b>${eur(s.caP)}</b></td><td class="r"><b>${eur(s.caR)}</b></td>
    <td class="r"><b>${nb(s.visP)}${s.visR?' → '+nb(s.visR):''}</b></td>
    <td class="r"><b>${s.visR?(s.caR/s.visR).toFixed(2).replace('.',',')+' €':'—'}</b></td></tr></table></div>`;

  // Par semaine
  h+='<h3>Semaine par semaine</h3><div class="scroll"><table class="tbl"><tr><th>Semaine</th><th class="r">Services</th><th class="r">Prévu</th><th class="r">Réel</th><th class="r">Visiteurs réels</th></tr>';
  const seen=new Set();
  for(let d=new Date(first);d<=last;d=addDays(d,1)){
    const mon=mondayOf(d),k=iso(mon);if(seen.has(k))continue;seen.add(k);
    const l=evInRange(mon,addDays(mon,6)).filter(e=>e.date>=iso(first)&&e.date<=iso(last)),ss=sumEvents(l);
    h+=`<tr class="click" data-week="${k}"><td>Sem. du ${mon.getDate()} ${MOIS[mon.getMonth()].slice(0,4)}.</td><td class="r">${ss.n}</td>
      <td class="r">${eur(ss.caP)}</td><td class="r">${ss.caR?'<b class="pos">'+eur(ss.caR)+'</b>':'—'}</td><td class="r">${ss.visR?nb(ss.visR):'—'}</td></tr>`;
  }
  h+='</table></div>';

  // Par étiquette
  h+='<h3>Par type d\'événement</h3><div class="scroll"><table class="tbl"><tr><th>Étiquette</th><th class="r">Services</th><th class="r">Prévu</th><th class="r">Réel</th><th class="r">Visiteurs réels</th></tr>';
  const byTag={};list.forEach(e=>(byTag[e.tag]=byTag[e.tag]||[]).push(e));
  Object.entries(byTag).sort((a,b)=>sumEvents(b[1]).caR-sumEvents(a[1]).caR||sumEvents(b[1]).caP-sumEvents(a[1]).caP).forEach(([id,l])=>{
    const ss=sumEvents(l),t=tagOf(id);
    h+=`<tr><td><span class="pill" style="--c:${t.color}"></span>${esc(t.name)}</td><td class="r">${ss.n}</td>
      <td class="r">${eur(ss.caP)}</td><td class="r">${ss.caR?'<b class="pos">'+eur(ss.caR)+'</b>':'—'}</td><td class="r">${ss.visR?nb(ss.visR):'—'}</td></tr>`;
  });
  h+='</table></div>';

  // Classement
  const ranked=list.filter(e=>e.caR!=null).sort((a,b)=>b.caR-a.caR);
  if(ranked.length){
    h+='<h3>Meilleurs services (CA réel)</h3><div class="scroll"><table class="tbl"><tr><th>#</th><th>Événement</th><th class="r">Réel</th><th class="r">vs prévu</th></tr>';
    ranked.slice(0,5).forEach((e,i)=>{
      const diff=e.caP!=null?e.caR-e.caP:null;
      h+=`<tr class="click" data-id="${e.id}"><td>${i+1}</td><td>${esc(e.title)}</td><td class="r"><b class="pos">${eur(e.caR)}</b></td>
        <td class="r ${diff==null?'':diff>=0?'pos':'neg'}">${diff==null?'—':(diff>=0?'+':'')+eur(diff)}</td></tr>`;
    });
    h+='</table></div>';
  }
  h+='</div>';
  $('stage').innerHTML=h;bindGoal();
}

/* ---------- Rendu général ---------- */
function render(){
  document.querySelectorAll('[data-view]').forEach(b=>b.classList.toggle('on',b.dataset.view===view));
  if(view==='week')renderWeek();else if(view==='month')renderMonth();else renderRecap();
}
document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>{view=b.dataset.view;render()});
$('prev').onclick=()=>{if(view==='week')cursor=addDays(cursor,-7);else cursor=new Date(cursor.getFullYear(),cursor.getMonth()-1,1);render()};
$('next').onclick=()=>{if(view==='week')cursor=addDays(cursor,7);else cursor=new Date(cursor.getFullYear(),cursor.getMonth()+1,1);render()};
$('today').onclick=()=>{cursor=new Date();render()};

/* Clics délégués sur la zone principale */
$('stage').addEventListener('click',e=>{
  const add=e.target.closest('[data-add]');
  if(add){openModal({date:add.dataset.add});return}
  const wk=e.target.closest('[data-week]');
  if(wk){cursor=parse(wk.dataset.week);view='week';render();return}
  const ev=e.target.closest('[data-id]');
  if(ev&&!ev.classList.contains('tag')){openModal(state.events.find(x=>x.id===ev.dataset.id));return}
  const mc=e.target.closest('.mc');
  if(mc)openModal({date:mc.dataset.date});
});

/* Glisser-déposer */
function bindDrop(sel){
  document.querySelectorAll(sel).forEach(el=>{
    el.addEventListener('dragover',e=>{e.preventDefault();el.classList.add('over')});
    el.addEventListener('dragleave',()=>el.classList.remove('over'));
    el.addEventListener('drop',e=>{
      e.preventDefault();el.classList.remove('over');
      const id=e.dataTransfer.getData('text/plain');
      if(state.tags.some(t=>t.id===id))openModal({date:el.dataset.date,tag:id});
    });
  });
}

/* ---------- Modal ---------- */
let editing=null,curPrio='orange';
function drawPrio(){
  $('fPrio').innerHTML=Object.entries(PRIOS).map(([k,p])=>`
    <label class="${curPrio===k?'sel':''}"><input type="radio" name="prio" value="${k}" ${curPrio===k?'checked':''}>
    <span class="dot" style="position:static;--p:${p.c}"></span>${p.n}</label>`).join('');
  $('fPrio').querySelectorAll('input').forEach(i=>i.onchange=()=>{curPrio=i.value;drawPrio()});
}
function openModal(ev){
  editing=ev&&ev.id?ev:null;
  $('mTitle').textContent=editing?'Modifier l\'événement':'Nouvel événement';
  $('fTag').innerHTML=state.tags.map(t=>`<option value="${t.id}">${esc(t.name)}</option>`).join('');
  const tg=ev.tag||state.tags[0]?.id;
  const tgObj=state.tags.find(t=>t.id===tg);
  $('fTitle').value=ev.title||(!editing&&tgObj?tgObj.name:'');
  $('fDate').value=ev.date||iso(new Date());
  $('fTime').value=ev.time||'';
  $('fPlace').value=ev.place||'';
  $('fTag').value=tg;
  $('fCaP').value=ev.caP??'';$('fVisP').value=ev.visP??'';
  $('fCaR').value=ev.caR??'';$('fVisR').value=ev.visR??'';
  $('fNote').value=ev.note||'';
  curPrio=ev.prio||'orange';drawPrio();
  $('bDel').style.display=editing?'':'none';
  $('modal').classList.add('open');setTimeout(()=>$('fTitle').focus(),50);
}
const closeModal=()=>$('modal').classList.remove('open');
$('bCancel').onclick=closeModal;
$('modal').addEventListener('click',e=>{if(e.target===$('modal'))closeModal()});
$('bSave').onclick=()=>{
  const title=$('fTitle').value.trim();
  if(!title||!$('fDate').value){alert('Titre et date obligatoires.');return}
  const data={title,date:$('fDate').value,time:$('fTime').value.trim(),place:$('fPlace').value.trim(),
    tag:$('fTag').value,prio:curPrio,note:$('fNote').value.trim(),
    caP:num($('fCaP').value),visP:num($('fVisP').value),caR:num($('fCaR').value),visR:num($('fVisR').value)};
  if(editing)Object.assign(editing,data);else state.events.push({id:uid(),...data});
  save();closeModal();render();toast('Enregistré');
};
$('bDel').onclick=()=>{
  if(editing&&confirm('Supprimer cet événement ?')){
    state.events=state.events.filter(e=>e.id!==editing.id);save();closeModal();render();toast('Supprimé')}
};
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});

/* ---------- Export / Import ---------- */
$('btnExport').onclick=()=>{
  const blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);
  a.download=`planning-foodtruck-${iso(new Date())}.json`;a.click();toast('Sauvegarde exportée');
};
$('btnImport').onclick=()=>$('fileImport').click();
$('fileImport').onchange=e=>{
  const f=e.target.files[0];if(!f)return;
  const r=new FileReader();
  r.onload=()=>{try{
    const s=JSON.parse(r.result);
    if(!s.tags||!s.events)throw 0;
    if(confirm('Remplacer le planning actuel par ce fichier ?')){
      state=s;state.goals=state.goals||{};
      state.events.forEach(ev=>{['caP','caR','visP','visR'].forEach(k=>{if(!(k in ev))ev[k]=null})});
      save();renderTags();render();toast('Planning importé')}
  }catch(err){alert('Fichier invalide.')}};
  r.readAsText(f);e.target.value='';
};

renderTags();render();
</script>
</body>
</html>
