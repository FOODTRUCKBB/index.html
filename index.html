<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BB · Planning Food Truck</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#1e1f20; --panel:#28292b; --panel2:#323436; --line:#3d3f42;
  --cream:#efe9e1; --muted:#9a968f;
  --blue:#0b57b0; --red:#e03328; --green:#2e9e5b; --orange:#e8892b; --grey:#6b6e72;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--cream);font-family:'Inter',sans-serif;min-height:100vh}
h1,h2,h3,.anton{font-family:'Anton',sans-serif;text-transform:uppercase;letter-spacing:.02em;font-weight:400}

header{padding:18px 24px 0;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.logo{font-family:'Anton';font-size:44px;line-height:1;text-align:center}
.logo .bar{display:flex;height:4px;margin-top:4px}
.logo .bar i{flex:1}.logo .bar i:nth-child(1){background:var(--blue)}
.logo .bar i:nth-child(2){background:#fff}.logo .bar i:nth-child(3){background:var(--red)}
header h1{font-size:28px;flex:1;min-width:200px}
header h1 small{display:block;font-family:'Inter';font-size:12px;color:var(--muted);letter-spacing:.1em;margin-top:2px}
.tricolor{height:4px;display:flex;margin-top:16px}
.tricolor i{flex:1}.tricolor i:nth-child(1){background:var(--blue)}
.tricolor i:nth-child(2){background:#fff}.tricolor i:nth-child(3){background:var(--red)}

button,.btn{background:var(--cream);color:var(--bg);border:none;padding:9px 14px;font-family:'Anton';
  text-transform:uppercase;letter-spacing:.04em;font-size:14px;cursor:pointer;border-radius:3px}
button:hover,.btn:hover{background:#fff}
button.ghost{background:transparent;color:var(--cream);border:1px solid var(--line)}
button.ghost:hover{border-color:var(--cream)}
button.danger{background:var(--red);color:#fff}

.layout{display:grid;grid-template-columns:270px 1fr;gap:20px;padding:20px 24px}
@media(max-width:900px){.layout{grid-template-columns:1fr}}

aside{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:16px;align-self:start}
aside h2{font-size:18px;margin-bottom:4px}
.hint{font-size:12px;color:var(--muted);margin-bottom:12px}
#tags{display:flex;flex-direction:column;gap:8px;margin-bottom:14px}
.tag{display:flex;align-items:center;gap:8px;background:var(--panel2);border-left:6px solid var(--c);
  padding:9px 10px;border-radius:3px;cursor:grab;font-weight:600;font-size:14px;user-select:none}
.tag:active{cursor:grabbing}
.tag span.name{flex:1}
.tag .x{background:none;color:var(--muted);padding:0 4px;font-family:'Inter';font-size:15px}
.tag .x:hover{color:var(--red);background:none}
.newtag{display:flex;gap:6px;border-top:1px solid var(--line);padding-top:12px}
.newtag input[type=text]{flex:1;min-width:0}
.newtag input[type=color]{width:38px;height:36px;border:none;background:none;padding:0;cursor:pointer}
input,select,textarea{background:var(--bg);border:1px solid var(--line);color:var(--cream);
  padding:8px 10px;border-radius:3px;font-family:'Inter';font-size:14px;width:100%}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--cream)}

.legend{margin-top:16px;border-top:1px solid var(--line);padding-top:12px;font-size:12px;color:var(--muted)}
.legend div{display:flex;align-items:center;gap:8px;margin-top:6px}
.dot{width:12px;height:12px;border-radius:50%;display:inline-block}

.nav{display:flex;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.nav h2{font-size:24px;flex:1;min-width:180px}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:8px}
@media(max-width:900px){.week{grid-template-columns:1fr}}
.day{background:var(--panel);border:1px solid var(--line);border-radius:6px;min-height:220px;padding:8px;display:flex;flex-direction:column;gap:6px}
.day.today{border-color:var(--cream)}
.day.over{background:var(--panel2);border-color:var(--cream)}
.dayhead{display:flex;justify-content:space-between;align-items:baseline;border-bottom:1px solid var(--line);padding-bottom:6px}
.dayhead .dn{font-family:'Anton';text-transform:uppercase;font-size:15px}
.dayhead .dd{font-size:12px;color:var(--muted)}
.add{margin-top:auto;background:transparent;color:var(--muted);border:1px dashed var(--line);font-family:'Inter';
  font-size:12px;text-transform:none;letter-spacing:0;padding:6px}
.add:hover{color:var(--cream);border-color:var(--cream);background:transparent}

.ev{background:var(--panel2);border-left:6px solid var(--c);border-radius:3px;padding:7px 8px;cursor:pointer;position:relative;font-size:13px}
.ev:hover{background:#3a3c3f}
.ev .t{font-weight:700;line-height:1.2}
.ev .m{color:var(--muted);font-size:11px;margin-top:2px}
.ev .imp{position:absolute;top:7px;right:7px;width:11px;height:11px;border-radius:50%;background:var(--ic)}
.ev .st{display:inline-block;font-size:10px;margin-top:4px;padding:1px 6px;border-radius:2px;background:var(--bg);color:var(--cream);
  text-transform:uppercase;letter-spacing:.05em}
.ev.multi{border-style:solid}

/* modale */
.modal{position:fixed;inset:0;background:rgba(0,0,0,.7);display:none;align-items:center;justify-content:center;padding:16px;z-index:10}
.modal.open{display:flex}
.box{background:var(--panel);border:1px solid var(--line);border-top:4px solid var(--red);border-radius:6px;padding:20px;width:100%;max-width:440px;max-height:92vh;overflow:auto}
.box h3{font-size:22px;margin-bottom:14px}
.box label{display:block;font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;margin:10px 0 4px}
.row{display:flex;gap:10px}.row>*{flex:1}
.imps{display:flex;gap:8px}
.imps label{flex:1;margin:0;text-align:center;cursor:pointer;color:var(--cream);font-size:12px;
  text-transform:none;letter-spacing:0;border:2px solid var(--line);border-radius:4px;padding:8px 4px}
.imps input{display:none}
.imps input:checked+span{font-weight:700}
.imps label:has(input:checked){border-color:var(--ic);background:var(--bg)}
.actions{display:flex;gap:8px;margin-top:18px;justify-content:flex-end}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--cream);color:var(--bg);
  padding:10px 18px;border-radius:4px;font-weight:700;display:none;z-index:20}
</style>
</head>
<body>

<header>
  <div class="logo">BB<div class="bar"><i></i><i></i><i></i></div></div>
  <h1>Planning Food Truck<small>ÉVÉNEMENTS · CONTRATS · MATCHS</small></h1>
  <button class="ghost" id="btnExport">Exporter</button>
  <button class="ghost" id="btnImport">Importer</button>
  <input type="file" id="fileImport" accept=".json" hidden>
</header>
<div class="tricolor"><i></i><i></i><i></i></div>

<div class="layout">
  <aside>
    <h2>Étiquettes</h2>
    <p class="hint">Glisse une étiquette sur un jour du planning pour créer un événement.</p>
    <div id="tags"></div>
    <div class="newtag">
      <input type="text" id="newTagName" placeholder="Nouvelle étiquette">
      <input type="color" id="newTagColor" value="#0b57b0">
      <button id="btnAddTag">+</button>
    </div>
    <div class="legend">
      <strong class="anton" style="font-size:13px;color:var(--cream)">Importance</strong>
      <div><span class="dot" style="background:var(--red)"></span>Obligatoire</div>
      <div><span class="dot" style="background:var(--green)"></span>Confirmé / rentable</div>
      <div><span class="dot" style="background:var(--orange)"></span>À confirmer</div>
      <div><span class="dot" style="background:var(--grey)"></span>Optionnel</div>
    </div>
  </aside>

  <main>
    <div class="nav">
      <button class="ghost" id="prev">←</button>
      <button class="ghost" id="today">Aujourd'hui</button>
      <button class="ghost" id="next">→</button>
      <h2 id="weekTitle"></h2>
    </div>
    <div class="week" id="week"></div>
  </main>
</div>

<!-- Modale événement -->
<div class="modal" id="modal">
  <div class="box">
    <h3 id="modalTitle">Événement</h3>
    <label>Titre</label>
    <input type="text" id="fTitle">
    <label>Étiquette</label>
    <select id="fTag"></select>
    <div class="row">
      <div><label>Date début</label><input type="date" id="fDate"></div>
      <div><label>Date fin (option)</label><input type="date" id="fDateEnd"></div>
    </div>
    <div class="row">
      <div><label>Heure début</label><input type="time" id="fStart"></div>
      <div><label>Heure fin</label><input type="time" id="fEnd"></div>
    </div>
    <label>Lieu</label>
    <input type="text" id="fPlace">
    <label>Importance</label>
    <div class="imps" id="fImp">
      <label style="--ic:var(--red)"><input type="radio" name="imp" value="red"><span>🟥 Obligatoire</span></label>
      <label style="--ic:var(--green)"><input type="radio" name="imp" value="green"><span>🟩 Confirmé</span></label>
      <label style="--ic:var(--orange)"><input type="radio" name="imp" value="orange"><span>🟧 À confirmer</span></label>
      <label style="--ic:var(--grey)"><input type="radio" name="imp" value="grey"><span>⬜ Option</span></label>
    </div>
    <label>Statut</label>
    <select id="fStatus">
      <option value="">—</option>
      <option>À contacter</option>
      <option>Demande envoyée</option>
      <option>Confirmé</option>
      <option>Refusé</option>
    </select>
    <label>Notes</label>
    <textarea id="fNotes" rows="3"></textarea>
    <div class="actions">
      <button class="danger" id="btnDelete">Supprimer</button>
      <button class="ghost" id="btnCancel">Annuler</button>
      <button id="btnSave">Enregistrer</button>
    </div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
const KEY='bb_planning_v1';
const IMP={red:'#e03328',green:'#2e9e5b',orange:'#e8892b',grey:'#6b6e72'};
const DAYS=['Lun','Mar','Mer','Jeu','Ven','Sam','Dim'];
const MONTHS=['janv.','févr.','mars','avr.','mai','juin','juil.','août','sept.','oct.','nov.','déc.'];

const pad=n=>String(n).padStart(2,'0');
const iso=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parse=s=>{const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};
const uid=()=>Math.random().toString(36).slice(2,10);
const mondayOf=d=>{const x=new Date(d);x.setHours(0,0,0,0);x.setDate(x.getDate()-((x.getDay()+6)%7));return x};

function defaults(){
  const tags=[
    {id:'scabb',name:'SCABB',color:'#e03328'},
    {id:'asse',name:'ASSE',color:'#2e9e5b'},
    {id:'ol',name:'OL',color:'#0b57b0'},
    {id:'lou',name:'LOU Rugby',color:'#b02a2a'},
    {id:'salon',name:'Salon / Expo',color:'#e8892b'},
    {id:'nomad',name:'Nomad Kitchen',color:'#8e5bd6'},
    {id:'autre',name:'Autre',color:'#6b6e72'}
  ];
  const E=(title,tag,date,end,imp,place,notes,status,start,fin)=>({id:uid(),title,tag,date,dateEnd:end||'',imp,place:place||'',notes:notes||'',status:status||'',start:start||'',end:fin||''});
  const events=[
    E('SCABB – Aix-Maurienne','scabb','2026-12-04','','red','Salle SCABB','Match à domicile'),
    E('ASSE – Nancy','asse','2026-12-05','','orange','Stade Geoffroy-Guichard','À vérifier : emplacement food truck','À contacter'),
    E('SCABB – Levallois','scabb','2026-12-08','','red','Salle SCABB','Match à domicile'),
    E('Mondial des Métiers (ou OL)','salon','2026-12-10','2026-12-13','orange','Eurexpo Lyon','Choix à faire entre Mondial des Métiers et matchs OL (10 et 13 déc.). Demander les emplacements food truck.','À contacter'),
    E('LOU – Toulon','lou','2026-12-19','','orange','Matmut Stadium Gerland','Rugby, 14h30','À contacter','14:30'),
    E('SCABB – Orléans','scabb','2026-12-22','','red','Salle SCABB','Match à domicile')
  ];
  return {tags,events};
}

let state=load();
let weekStart=mondayOf(new Date());
// si on est avant décembre 2026, ouvrir sur la première semaine de décembre
(function(){const t=new Date(); if(t<new Date(2026,11,1)) weekStart=mondayOf(new Date(2026,11,1));})();
let editingId=null, draggedTag=null;

function load(){
  try{const s=JSON.parse(localStorage.getItem(KEY));if(s&&s.tags&&s.events)return s}catch(e){}
  const d=defaults();localStorage.setItem(KEY,JSON.stringify(d));return d;
}
function save(){localStorage.setItem(KEY,JSON.stringify(state))}
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.style.display='block';setTimeout(()=>t.style.display='none',2200)}
const tagOf=id=>state.tags.find(t=>t.id===id)||{name:'?',color:'#6b6e72'};

/* ---------- Étiquettes ---------- */
function renderTags(){
  const box=document.getElementById('tags');box.innerHTML='';
  state.tags.forEach(t=>{
    const el=document.createElement('div');el.className='tag';el.draggable=true;
    el.style.setProperty('--c',t.color);
    el.innerHTML=`<span class="name"></span><button class="x" title="Supprimer">✕</button>`;
    el.querySelector('.name').textContent=t.name;
    el.addEventListener('dragstart',e=>{draggedTag=t.id;e.dataTransfer.setData('text/plain',t.id)});
    el.addEventListener('click',e=>{if(e.target.classList.contains('x'))return;openModal(null,{tag:t.id,date:iso(new Date())})});
    el.querySelector('.x').addEventListener('click',()=>{
      if(confirm(`Supprimer l'étiquette « ${t.name} » ? Les événements liés passeront en « Autre ».`)){
        state.events.forEach(ev=>{if(ev.tag===t.id)ev.tag='autre'});
        state.tags=state.tags.filter(x=>x.id!==t.id);save();render();
      }
    });
    box.appendChild(el);
  });
}
document.getElementById('btnAddTag').onclick=()=>{
  const n=document.getElementById('newTagName'),c=document.getElementById('newTagColor');
  if(!n.value.trim())return;
  state.tags.push({id:uid(),name:n.value.trim(),color:c.value});n.value='';save();render();
};

/* ---------- Planning ---------- */
function eventsOn(dayIso){
  return state.events.filter(e=>{const end=e.dateEnd||e.date;return dayIso>=e.date&&dayIso<=end})
    .sort((a,b)=>(a.start||'99').localeCompare(b.start||'99'));
}
function renderWeek(){
  const w=document.getElementById('week');w.innerHTML='';
  const end=new Date(weekStart);end.setDate(end.getDate()+6);
  document.getElementById('weekTitle').textContent=
    `${weekStart.getDate()} ${MONTHS[weekStart.getMonth()]} → ${end.getDate()} ${MONTHS[end.getMonth()]} ${end.getFullYear()}`;
  const todayIso=iso(new Date());
  for(let i=0;i<7;i++){
    const d=new Date(weekStart);d.setDate(d.getDate()+i);const di=iso(d);
    const col=document.createElement('div');col.className='day'+(di===todayIso?' today':'');
    col.innerHTML=`<div class="dayhead"><span class="dn">${DAYS[i]}</span><span class="dd">${d.getDate()} ${MONTHS[d.getMonth()]}</span></div>`;
    eventsOn(di).forEach(ev=>{
      const t=tagOf(ev.tag),el=document.createElement('div');
      el.className='ev'+(ev.dateEnd?' multi':'');
      el.style.setProperty('--c',t.color);el.style.setProperty('--ic',IMP[ev.imp]||IMP.grey);
      const time=ev.start?ev.start+(ev.end?'–'+ev.end:''):'';
      el.innerHTML=`<span class="imp"></span><div class="t"></div><div class="m"></div>${ev.status?'<span class="st"></span>':''}`;
      el.querySelector('.t').textContent=ev.title;
      el.querySelector('.m').textContent=[t.name,time,ev.place].filter(Boolean).join(' · ');
      if(ev.status)el.querySelector('.st').textContent=ev.status;
      el.onclick=()=>openModal(ev.id);
      col.appendChild(el);
    });
    const add=document.createElement('button');add.className='add';add.textContent='+ ajouter';
    add.onclick=()=>openModal(null,{date:di});col.appendChild(add);
    col.addEventListener('dragover',e=>{e.preventDefault();col.classList.add('over')});
    col.addEventListener('dragleave',()=>col.classList.remove('over'));
    col.addEventListener('drop',e=>{e.preventDefault();col.classList.remove('over');
      const tid=e.dataTransfer.getData('text/plain')||draggedTag;
      if(tid)openModal(null,{tag:tid,date:di,title:tagOf(tid).name});});
    w.appendChild(col);
  }
}
function render(){renderTags();renderWeek()}

/* ---------- Modale ---------- */
const $=id=>document.getElementById(id);
function openModal(id,pre={}){
  editingId=id;
  const ev=id?state.events.find(e=>e.id===id):null;
  $('fTag').innerHTML=state.tags.map(t=>`<option value="${t.id}">${t.name.replace(/</g,'<')}</option>`).join('');
  $('modalTitle').textContent=ev?"Modifier l'événement":'Nouvel événement';
  $('fTitle').value=ev?ev.title:(pre.title||'');
  $('fTag').value=ev?ev.tag:(pre.tag||state.tags[0].id);
  $('fDate').value=ev?ev.date:(pre.date||iso(new Date()));
  $('fDateEnd').value=ev?ev.dateEnd:'';
  $('fStart').value=ev?ev.start:'';$('fEnd').value=ev?ev.end:'';
  $('fPlace').value=ev?ev.place:'';
  $('fStatus').value=ev?ev.status:'';
  $('fNotes').value=ev?ev.notes:'';
  const imp=ev?ev.imp:'orange';
  document.querySelector(`input[name=imp][value=${imp}]`).checked=true;
  $('btnDelete').style.display=ev?'inline-block':'none';
  $('modal').classList.add('open');$('fTitle').focus();
}
const closeModal=()=>$('modal').classList.remove('open');
$('btnCancel').onclick=closeModal;
$('modal').addEventListener('click',e=>{if(e.target.id==='modal')closeModal()});
$('btnSave').onclick=()=>{
  const title=$('fTitle').value.trim();if(!title){$('fTitle').focus();return}
  const data={title,tag:$('fTag').value,date:$('fDate').value,dateEnd:$('fDateEnd').value,
    start:$('fStart').value,end:$('fEnd').value,place:$('fPlace').value.trim(),
    imp:document.querySelector('input[name=imp]:checked').value,status:$('fStatus').value,notes:$('fNotes').value};
  if(!data.date)return;
  if(data.dateEnd&&data.dateEnd<data.date)data.dateEnd='';
  if(editingId){Object.assign(state.events.find(e=>e.id===editingId),data)}
  else state.events.push({id:uid(),...data});
  save();closeModal();render();
};
$('btnDelete').onclick=()=>{
  if(confirm('Supprimer cet événement ?')){state.events=state.events.filter(e=>e.id!==editingId);save();closeModal();render()}
};

/* ---------- Navigation ---------- */
$('prev').onclick=()=>{weekStart.setDate(weekStart.getDate()-7);renderWeek()};
$('next').onclick=()=>{weekStart.setDate(weekStart.getDate()+7);renderWeek()};
$('today').onclick=()=>{weekStart=mondayOf(new Date());renderWeek()};

/* ---------- Export / Import ---------- */
$('btnExport').onclick=()=>{
  const blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);
  a.download=`planning-foodtruck-${iso(new Date())}.json`;a.click();toast('Sauvegarde exportée');
};
$('btnImport').onclick=()=>$('fileImport').click();
$('fileImport').onchange=e=>{
  const f=e.target.files[0];if(!f)return;
  const r=new FileReader();
  r.onload=()=>{try{
    const s=JSON.parse(r.result);
    if(!s.tags||!s.events)throw 0;
    if(confirm('Remplacer le planning actuel par ce fichier ?')){state=s;save();render();toast('Planning importé')}
  }catch(err){alert('Fichier invalide.')}};
  r.readAsText(f);e.target.value='';
};

render();
</script>
</body>
</html>
